{% extends "core/base.html" %}
{% block content %}
{% if validlink %}
  <h1>Set a new password</h1>
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
  </form>
{% else %}
  <h1>Link invalid</h1>
  <p>This reset link has expired or already been used.</p>
{% endif %}
{% endblock %}
