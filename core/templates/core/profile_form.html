{% extends "core/base.html" %}
{% block content %}
<h1>Edit profile</h1>
<div class="card wide">
  <form method="post" enctype="multipart/form-data">{% csrf_token %}
    {{ form.as_p }}
    <div class="row-actions">
      <button class="btn gold" type="submit">Save</button>
      <a class="btn secondary" href="{% url 'profile' %}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
